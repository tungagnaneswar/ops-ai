server:
  port: 8082

spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://localhost:5432/opsai_incident
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none # Using manual schema.sql
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
