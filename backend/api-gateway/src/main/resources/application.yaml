server:
  port: 8080

spring:
  application:
    name: api-gateway

    cloud:
      gateway:
        globalcors:
          cors-configurations:
            '[/**]':
              allowedOrigins: "http://localhost:5173"
              allowedMethods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              allowedHeaders: "*"
        routes:
          # Example 1: Route to an authentication microservice running on port 8081
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/auth/**

          # Example 2: Route to an incident microservice running on port 8082
          - id: incident-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/incident/**
