    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

# ============================================================================
# Persistent Storage Volumes
# ============================================================================
volumes:
  redis_data:
    name: ops-ai-redis-data
  kafka_data:
    name: ops-ai-kafka-data

# ============================================================================
# Shared Network
# ============================================================================
networks:
  ops-ai-network:
    name: ops-ai-network
    driver: bridge