services:
  # ============================================================================
  # Infrastructure Services (Started by default: `docker compose up -d`)
  # Redis & Kafka run in Docker. PostgreSQL runs directly on your local machine!
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: ops-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: ops-ai-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ops-ai-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================================
  # Backend Microservices (Profile: `backend` or `all`)
  # Start with: `docker compose --profile backend up -d`
  #
  # Connects to your local machine's native PostgreSQL via `host.docker.internal:5432`
  # ============================================================================

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: ops-ai-api-gateway
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      INCIDENT_SERVICE_URL: http://incident-service:8082
      TEAM_SERVICE_URL: http://team-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      AUDIT_SERVICE_URL: http://audit-service:8085
      AI_SERVICE_URL: http://ai-service:8086
      EVENT_SIMULATOR_URL: http://event-simulator:8087
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      auth-service:
        condition: service_started
      incident-service:
        condition: service_started
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: ops-ai-auth-service
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_auth
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  incident-service:
    build:
      context: ./backend/incident-service
      dockerfile: Dockerfile
    container_name: ops-ai-incident-service
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_incident
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  team-service:
    build:
      context: ./backend/team-service
      dockerfile: Dockerfile
    container_name: ops-ai-team-service
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_teams
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: ops-ai-notification-service
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_notification
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  audit-service:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: ops-ai-audit-service
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_audit
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: ops-ai-ai-service
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8086:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_ai
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ops-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  event-simulator:
    build:
      context: ./backend/event-simulator
      dockerfile: Dockerfile
    container_name: ops-ai-event-simulator
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "8087:8087"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:5432/opsai_event
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
    depends_on:
